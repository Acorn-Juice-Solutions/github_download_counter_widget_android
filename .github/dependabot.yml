version: 2

# Cooldown windows are the point of the additions below.
#
# Malicious releases are published from stolen maintainer tokens, so they are
# correctly signed and pass every signature check. What catches them is time:
# they get spotted and yanked within hours to days. Declining to adopt anything
# younger than a week sidesteps most of that class without waiting for anyone
# to catalogue the compromise. Security updates bypass cooldown by design.
#
# Note these PRs will fail CI until app/gradle.lockfile is regenerated, because
# Dependabot does not understand Gradle lockfiles. relock.yml handles that
# automatically for PRs labelled `dependencies`.

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    labels:
      - dependencies
      - gradle
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      test-libs:
        patterns:
          - "junit:junit"
          - "com.google.truth:*"
          - "org.robolectric:*"
          - "com.squareup.okhttp3:mockwebserver"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      # No parseable semver for Dependabot here, so only default-days applies.
      default-days: 7
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
