name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default, as in ci.yml: the SBOM job has no business writing to
# the repository, and a job added later cannot silently inherit write.
permissions:
  contents: read

jobs:
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    # Deliberately a separate job from the signed build. sbom-action is
    # third-party code, and the publishing job holds the decoded release
    # keystore — keeping them apart means nothing third-party ever shares a
    # workspace, a runner or a secret scope with the signing key.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same generation path as supply-chain.yml, but against the tagged tree:
      # an SBOM attached to a release has to describe that release, not
      # whatever main happened to be when the nightly scan last ran.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          artifact-name: download-widget-${{ github.ref_name }}.cdx.json
          output-file: download-widget-${{ github.ref_name }}.cdx.json

      # syft emits an almost-empty document when it fails to read
      # app/gradle.lockfile. Attaching that is worse than attaching nothing: it
      # reads as a complete inventory of an app with nine dependencies.
      - name: Sanity-check the SBOM
        run: |
          set -euo pipefail
          file="download-widget-${GITHUB_REF_NAME}.cdx.json"
          count=$(jq '[.components[]?] | length' "$file")
          if [ "$count" -lt 10 ]; then
            echo "::error::Only $count components — syft probably did not read the lockfile."
            exit 1
          fi
          echo "### SBOM" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$count\` components catalogued for \`${GITHUB_REF_NAME}\`." >> "$GITHUB_STEP_SUMMARY"

  build-and-publish:
    name: Assemble signed release + upload to GitHub Release
    runs-on: ubuntu-latest
    # Fail closed: no SBOM, no release. A tag that cannot produce an inventory
    # is a tag whose contents we cannot describe.
    needs: sbom
    permissions:
      contents: write
      # attest-build-provenance signs through Sigstore using this job's OIDC
      # identity and writes the attestation to the repository's store.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to the repo (the release is published with
          # the action's own token), so the checkout credential is dead weight
          # in a job that also holds the signing keystore.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # ci.yml runs on branches: ["**"], so its Gradle cache is writable
          # from any branch, including one pushed on a fork PR. This job decodes
          # the release keystore and signs the APK, so it must not restore a
          # cache anyone else can seed. A cold build costs a couple of minutes
          # once per tag.
          cache-disabled: true

      # Before the keystore exists on disk, and in its own directory so the
      # release glob below cannot pick up anything else the job wrote.
      - name: Download the SBOM
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: download-widget-${{ github.ref_name }}.cdx.json
          path: sbom

      # The file name inside the artifact comes from sbom-action, not from us.
      # Resolve it once rather than hardcoding a name we do not control.
      - name: Locate the SBOM
        run: |
          set -euo pipefail
          file=$(find sbom -type f -name '*.cdx.json' -print -quit)
          if [ -z "$file" ]; then
            echo "::error::No .cdx.json inside the downloaded SBOM artifact."
            exit 1
          fi
          echo "SBOM_PATH=$file" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret KEYSTORE_BASE64. Configure release signing before tagging."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # AGP 9 removed applicationVariants, and its replacement only exposes
      # outputFileName through an internal VariantOutputImpl — not something to
      # lean on, given how much of this build already bends around AGP 9. The
      # tag is the better source anyway: it is what identifies the release, and
      # checking it against versionName here is what stops another release from
      # shipping as 1.0.1.
      - name: Name the APK after the tag
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          declared=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ "$declared" != "$expected" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} but versionName is \"$declared\". Bump app/build.gradle.kts before tagging."
            exit 1
          fi

          apk=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::assembleRelease produced no APK."
            exit 1
          fi

          target="app/build/outputs/apk/release/download-widget-${GITHUB_REF_NAME}.apk"
          mv "$apk" "$target"
          # v4 signing writes an .idsig beside the APK; incremental install only
          # finds it while the two names still match.
          if [ -f "$apk.idsig" ]; then
            mv "$apk.idsig" "$target.idsig"
          fi
          echo "APK published as \`$(basename "$target")\`." >> "$GITHUB_STEP_SUMMARY"

      # Both of these are actions/ — the same trust level as the checkout and
      # upload steps this job already runs. That is why they belong here and
      # the third-party generator stays out in its own job: provenance has to
      # be signed by the run that actually produced the binary.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app/build/outputs/apk/release/*.apk

      # The attached .cdx.json states what is inside the APK; this is what makes
      # that statement checkable. The attestation binds the SBOM to the APK's
      # digest, so a swapped binary or an edited inventory stops verifying.
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: app/build/outputs/apk/release/*.apk
          sbom-path: ${{ env.SBOM_PATH }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: download-widget-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            sbom/*.cdx.json
          generate_release_notes: true
