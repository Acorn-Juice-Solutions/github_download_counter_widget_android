name: Supply chain

# ci.yml proves the code works. This proves we know what is in it.
#
# The lockfile is what makes any of this meaningful: before it existed, the
# version catalog pinned 18 direct dependencies while 88 resolved artifacts
# went unrecorded, so an SBOM would have described a build that never happened.

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  schedule:
    # Daily. This repo can sit untouched for weeks, and advisories land against
    # versions already shipped — a push-only scan would never see them.
    - cron: "31 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  OSV_SCANNER_VERSION: "2.6.0"
  OSV_SCANNER_SHA256: "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  lockfile:
    name: Lockfile integrity
    runs-on: ubuntu-latest
    # Dependabot's PRs legitimately arrive with a stale lock; relock.yml fixes
    # them. Running this there would just report a failure we already expect.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      # Re-resolve and compare. A lock edited by hand, or left behind after a
      # version bump, shows up here rather than as a mystery at release time.
      - name: Lock matches the declared dependencies
        run: |
          set -euo pipefail
          ./gradlew resolveAndLockAll --write-locks --no-configuration-cache -q
          if ! git diff --exit-code -- '*.lockfile'; then
            echo "::error::Lockfile is stale or hand-edited. Run: ./gradlew resolveAndLockAll --write-locks"
            exit 1
          fi
          echo "Lockfile matches the declared dependencies." >> "$GITHUB_STEP_SUMMARY"

  dependencies:
    name: SBOM + dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Reads app/gradle.lockfile, so the SBOM covers the full resolved tree
      # and not just the 18 coordinates named in the version catalog.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: download-widget.cdx.json
          output-file: download-widget.cdx.json

      - name: Summarise SBOM
        run: |
          set -euo pipefail
          count=$(jq '[.components[]?] | length' download-widget.cdx.json)
          echo "### SBOM" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$count\` components catalogued." >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -lt 10 ]; then
            echo "::error::Only $count components — syft probably did not read the lockfile."
            exit 1
          fi

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          url="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          curl -fsSL "$url" -o /tmp/osv-scanner
          echo "${OSV_SCANNER_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner

      - name: Scan dependencies
        run: |
          set -uo pipefail
          /tmp/osv-scanner scan source --format json --output osv.json . || true
          test -s osv.json || echo '{"results":[]}' > osv.json

      - name: Block on malicious packages
        run: |
          set -euo pipefail
          jq -r '
            [ .results[]?.packages[]?
              | .package.name as $pkg
              | .vulnerabilities[]?
              | ([.id] + (.aliases // []))[]
              | select(startswith("MAL-"))
              | "\($pkg)\t\(.)"
            ] | unique | .[]
          ' osv.json > malicious.txt || true

          if [ -s malicious.txt ]; then
            {
              echo "### Malicious packages detected"
              echo ""
              echo "| Package | Advisory |"
              echo "| --- | --- |"
              awk -F'\t' '{printf "| `%s` | %s |\n", $1, $2}' malicious.txt
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Known-malicious package present in the dependency tree."
            cat malicious.txt
            exit 1
          fi
          echo "No known-malicious packages." >> "$GITHUB_STEP_SUMMARY"

      - name: Report vulnerabilities (non-blocking)
        run: |
          set -euo pipefail
          jq -r '
            [ .results[]?.packages[]?
              | .package.name as $pkg
              | .package.version as $ver
              | .vulnerabilities[]?
              | "\($pkg)\t\($ver)\t\(.id)"
            ] | unique | .[]
          ' osv.json > vulns.txt || true
          n=$(wc -l < vulns.txt | tr -d ' ')
          {
            echo "### Vulnerabilities: $n"
            if [ "$n" -gt 0 ]; then
              echo ""
              echo "| Package | Version | Advisory |"
              echo "| --- | --- | --- |"
              awk -F'\t' '{printf "| `%s` | %s | %s |\n", $1, $2, $3}' vulns.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-reports
          path: |
            download-widget.cdx.json
            osv.json
          if-no-files-found: warn
          retention-days: 90

  dependency-graph:
    name: Submit dependency graph
    runs-on: ubuntu-latest
    # Only from main: the graph is repository-level state, and submitting it
    # from a PR would describe that branch as if it were the shipped tree.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # Feeds the full resolved graph to GitHub, which is what makes Dependabot
      # alerts fire on transitive dependencies. Free, and nothing to maintain.
      - name: Submit graph
        uses: gradle/actions/dependency-submission@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: this repo has handled a signing keystore, and a
          # secret that was committed and later removed is still leaked.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      - name: Scan history for secrets
        run: /tmp/gitleaks git --redact --verbose --exit-code 1 .

  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pipx install zizmor

      - name: Audit workflows
        run: zizmor --no-progress --min-severity high --persona regular .github/workflows/
