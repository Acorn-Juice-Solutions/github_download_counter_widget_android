# Gradle daemon JVM settings.
#
# The project ran without this file until now, which meant the daemon used Gradle's
# defaults — notably -XX:MaxMetaspaceSize=384m. That is not enough for AGP's lint analysis
# on a Kotlin codebase: `:app:lintVitalAnalyzeRelease` (which every `assembleRelease` runs)
# died with `java.lang.OutOfMemoryError: Metaspace`.
#
# Metaspace holds class metadata, and lint loads the whole project plus its own detector
# classes, so it is the ceiling that matters here — raising -Xmx alone would not have
# helped. 1g of metaspace leaves plenty of headroom; 4g of heap is comfortable on both a
# dev machine and a GitHub Actions runner.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# The Kotlin compile daemon is a separate process and does not inherit the settings above.
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
